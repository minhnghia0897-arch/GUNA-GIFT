<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2efe8"/>
      <stop offset="100%" style="stop-color:#eae6dc"/>
    </linearGradient>
    <linearGradient id="greenbox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6B3A"/>
      <stop offset="100%" style="stop-color:#3A5A2A"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B86A"/>
      <stop offset="100%" style="stop-color:#C8A84E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)"/>
  <!-- Light rays -->
  <polygon points="300,0 350,200 250,200" fill="#fff" opacity="0.08"/>
  <polygon points="400,0 420,150 360,150" fill="#fff" opacity="0.05"/>
  <!-- Table surface -->
  <ellipse cx="300" cy="530" rx="280" ry="30" fill="#e0d8c8" opacity="0.4"/>
  <!-- Cake stand right -->
  <rect x="380" y="350" width="70" height="6" rx="3" fill="#c8bca4"/>
  <rect x="407" y="356" width="16" height="45" rx="2" fill="#bab0a0"/>
  <ellipse cx="415" cy="405" rx="30" ry="6" fill="#bab0a0"/>
  <!-- Small cake on stand -->
  <ellipse cx="415" cy="345" rx="22" ry="8" fill="#e8e0d0"/>
  <rect x="393" y="330" width="44" height="15" rx="8" fill="#f0e8d8"/>
  <!-- Front box (larger) -->
  <rect x="140" y="260" width="160" height="170" rx="5" fill="url(#greenbox)"/>
  <rect x="146" y="266" width="148" height="158" rx="3" stroke="url(#gold3)" stroke-width="2" fill="none"/>
  <!-- Box top front -->
  <rect x="134" y="250" width="172" height="16" rx="4" fill="#3A5A2A"/>
  <!-- Top pattern -->
  <rect x="140" y="250" width="160" height="12" rx="2" fill="#4A6B3A" opacity="0.8"/>
  <!-- Floral corners -->
  <circle cx="160" cy="268" r="3" fill="#D4B86A" opacity="0.4"/>
  <circle cx="288" cy="268" r="3" fill="#D4B86A" opacity="0.4"/>
  <!-- Arch on front box -->
  <path d="M180 320 Q220 275 260 320" stroke="#D4B86A" stroke-width="2" fill="none"/>
  <circle cx="220" cy="335" r="16" stroke="#D4B86A" stroke-width="1.5" fill="none"/>
  <circle cx="220" cy="335" r="6" fill="#D4B86A"/>
  <!-- Sunburst -->
  <line x1="220" y1="350" x2="185" y2="380" stroke="#D4B86A" stroke-width="0.5" opacity="0.5"/>
  <line x1="220" y1="350" x2="205" y2="385" stroke="#D4B86A" stroke-width="0.5" opacity="0.5"/>
  <line x1="220" y1="350" x2="220" y2="388" stroke="#D4B86A" stroke-width="0.5" opacity="0.5"/>
  <line x1="220" y1="350" x2="235" y2="385" stroke="#D4B86A" stroke-width="0.5" opacity="0.5"/>
  <line x1="220" y1="350" x2="255" y2="380" stroke="#D4B86A" stroke-width="0.5" opacity="0.5"/>
  <!-- Text front box -->
  <text x="220" y="400" text-anchor="middle" fill="#D4B86A" font-family="serif" font-size="14" font-weight="bold">HAPPY</text>
  <text x="220" y="418" text-anchor="middle" fill="#D4B86A" font-family="serif" font-size="11" letter-spacing="2">WEDDING</text>
  <!-- Back box (on stand, smaller perspective) -->
  <rect x="320" y="200" width="130" height="140" rx="4" fill="url(#greenbox)" opacity="0.9"/>
  <rect x="325" y="205" width="120" height="130" rx="2" stroke="url(#gold3)" stroke-width="1.5" fill="none"/>
  <rect x="315" y="192" width="140" height="14" rx="3" fill="#3A5A2A"/>
  <!-- Arch on back box -->
  <path d="M355 250 Q385 220 415 250" stroke="#D4B86A" stroke-width="1" fill="none"/>
  <circle cx="385" cy="258" r="10" stroke="#D4B86A" stroke-width="1" fill="none"/>
  <circle cx="385" cy="258" r="4" fill="#D4B86A"/>
  <text x="385" y="298" text-anchor="middle" fill="#D4B86A" font-family="serif" font-size="11" font-weight="bold">HAPPY</text>
  <text x="385" y="312" text-anchor="middle" fill="#D4B86A" font-family="serif" font-size="8" letter-spacing="1">WEDDING</text>
  <!-- Scattered leaves -->
  <ellipse cx="350" cy="500" rx="18" ry="10" fill="#7aa060" opacity="0.4" transform="rotate(-20 350 500)"/>
  <ellipse cx="160" cy="480" rx="12" ry="7" fill="#7aa060" opacity="0.3" transform="rotate(15 160 480)"/>
  <ellipse cx="470" cy="470" rx="14" ry="8" fill="#7aa060" opacity="0.35" transform="rotate(-30 470 470)"/>
  <!-- Rose petals -->
  <ellipse cx="280" cy="490" rx="6" ry="9" fill="#9B2335" opacity="0.4" transform="rotate(30 280 490)"/>
  <ellipse cx="420" cy="480" rx="5" ry="8" fill="#9B2335" opacity="0.35" transform="rotate(-20 420 480)"/>
  <ellipse cx="200" cy="510" rx="5" ry="7" fill="#9B2335" opacity="0.3" transform="rotate(45 200 510)"/>
  <!-- Small berries -->
  <circle cx="130" cy="450" r="3" fill="#9B2335" opacity="0.5"/>
  <circle cx="138" cy="445" r="2.5" fill="#9B2335" opacity="0.45"/>
  <circle cx="125" cy="455" r="2" fill="#c04050" opacity="0.4"/>
  <!-- Wine glass -->
  <rect x="390" y="130" width="2" height="50" fill="#d4d4d4" opacity="0.4"/>
  <ellipse cx="391" cy="125" rx="18" ry="28" fill="#e8e8e8" opacity="0.25" stroke="#d4d4d4" stroke-width="0.5"/>
  <rect x="380" y="180" width="22" height="3" rx="1" fill="#d4d4d4" opacity="0.4"/>
  <!-- Guna Food logo -->
  <circle cx="80" cy="540" r="22" fill="#E8603C" opacity="0.8"/>
  <text x="80" y="545" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">G</text>
  <text x="80" y="575" text-anchor="middle" fill="#E8603C" font-size="10" font-weight="bold">Guna Food</text>
</svg>
