<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede6"/>
      <stop offset="100%" style="stop-color:#e8e4da"/>
    </linearGradient>
    <linearGradient id="honey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A830"/>
      <stop offset="100%" style="stop-color:#C08020"/>
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2035"/>
      <stop offset="100%" style="stop-color:#6B1525"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <!-- Curtain backdrop -->
  <path d="M150 0 Q200 100 180 600" stroke="#ddd8cc" stroke-width="40" fill="none" opacity="0.3"/>
  <path d="M450 0 Q400 100 420 600" stroke="#ddd8cc" stroke-width="40" fill="none" opacity="0.3"/>
  <!-- Arch backdrop -->
  <path d="M200 500 L200 200 Q300 80 400 200 L400 500" fill="none" stroke="#d4cbb8" stroke-width="2" opacity="0.4"/>
  <!-- Leaf decorations on arch -->
  <path d="M210 300 Q220 280 230 300 Q220 290 210 300Z" fill="#c8bfa0" opacity="0.4"/>
  <path d="M380 280 Q390 260 400 280 Q390 270 380 280Z" fill="#c8bfa0" opacity="0.4"/>
  <!-- Bottle body -->
  <rect x="230" y="160" width="140" height="320" rx="12" fill="url(#honey)" opacity="0.85"/>
  <!-- Bottle neck -->
  <rect x="270" y="100" width="60" height="70" rx="6" fill="url(#honey)" opacity="0.85"/>
  <!-- Bottle cap -->
  <rect x="275" y="85" width="50" height="22" rx="5" fill="#C0C0C0"/>
  <rect x="278" y="82" width="44" height="6" rx="3" fill="#D8D8D8"/>
  <!-- Bottle outline -->
  <rect x="230" y="160" width="140" height="320" rx="12" fill="none" stroke="#B89030" stroke-width="1" opacity="0.5"/>
  <!-- Label -->
  <rect x="245" y="240" width="110" height="160" rx="4" fill="url(#label)"/>
  <rect x="249" y="244" width="102" height="152" rx="2" stroke="#D4B86A" stroke-width="1.5" fill="none"/>
  <!-- Label arch -->
  <path d="M270 290 Q300 255 330 290" stroke="#D4B86A" stroke-width="1.5" fill="none"/>
  <circle cx="300" cy="300" r="14" stroke="#D4B86A" stroke-width="1" fill="none"/>
  <circle cx="300" cy="300" r="5" fill="#D4B86A"/>
  <!-- Sunburst lines -->
  <line x1="300" y1="310" x2="260" y2="340" stroke="#D4B86A" stroke-width="0.5" opacity="0.6"/>
  <line x1="300" y1="310" x2="280" y2="345" stroke="#D4B86A" stroke-width="0.5" opacity="0.6"/>
  <line x1="300" y1="310" x2="300" y2="348" stroke="#D4B86A" stroke-width="0.5" opacity="0.6"/>
  <line x1="300" y1="310" x2="320" y2="345" stroke="#D4B86A" stroke-width="0.5" opacity="0.6"/>
  <line x1="300" y1="310" x2="340" y2="340" stroke="#D4B86A" stroke-width="0.5" opacity="0.6"/>
  <!-- Label text -->
  <text x="300" y="365" text-anchor="middle" fill="#D4B86A" font-family="serif" font-size="13" font-weight="bold">AMBER</text>
  <text x="300" y="382" text-anchor="middle" fill="#D4B86A" font-family="serif" font-size="10" letter-spacing="2">WHISPER</text>
  <!-- Jade stones -->
  <ellipse cx="190" cy="480" rx="15" ry="10" fill="#8FB878" opacity="0.7"/>
  <ellipse cx="210" cy="490" rx="12" ry="8" fill="#A0C888" opacity="0.6"/>
  <!-- Bees -->
  <ellipse cx="400" cy="370" rx="8" ry="5" fill="#D4A820" opacity="0.7"/>
  <line x1="394" y1="366" x2="390" y2="360" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <line x1="406" y1="366" x2="410" y2="360" stroke="#888" stroke-width="0.5" opacity="0.5"/>
  <ellipse cx="180" cy="420" rx="6" ry="4" fill="#D4A820" opacity="0.5"/>
  <!-- Guna Food logo -->
  <circle cx="80" cy="60" r="25" fill="#E8603C" opacity="0.8"/>
  <text x="80" y="65" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">G</text>
  <text x="80" y="100" text-anchor="middle" fill="#E8603C" font-size="11" font-weight="bold">Guna Food</text>
</svg>
